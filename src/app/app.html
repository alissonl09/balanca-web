<div class="app-shell">

  <!-- Cabeçalho principal -->
  <header class="topbar">
    <div class="brand-area">
      <img
        src="/images/logo-topo.svg"
        alt="Logo Cooxupé"
        class="brand-logo"
      />

      <div class="header-context">
        <strong>Alisson Rodrigues Romano</strong>

        <span>
          Matriz Cooxupé
          <span class="header-separator">•</span>
          Sistema de Pesagem
        </span>
      </div>
    </div>

    <div class="profile-area">
      <button
        type="button"
        class="notification-button"
        aria-label="Notificações"
      >
        ♧
      </button>

      <div class="profile-avatar">
        AR
      </div>

      <div class="profile-description">
        <strong>Alisson Romano</strong>
        <span>Operador</span>
      </div>

      <span class="profile-arrow">
        ⌄
      </span>
    </div>
  </header>

  <div class="workspace">

    <!-- Menu lateral -->
    <aside class="sidebar">

      <!-- Pesagem -->
      <button
        type="button"
        class="menu-item"
        routerLink="/pesagem"
        routerLinkActive="active"
      >
        <img
          src="/images/balanca_icon.svg"
          alt=""
          class="menu-image"
        />

        <span>Pesagem</span>
      </button>

      <!-- Veículos -->
      <button
        type="button"
        class="menu-item"
      >
        <img
          src="/images/truck.svg"
          alt=""
          class="menu-image"
        />

        <span>Veículos</span>
      </button>

      <!-- Configurações -->
      <button
        type="button"
        class="menu-item"
        routerLink="/configuracoes"
        routerLinkActive="active"
      >
        <img
          src="/images/config.svg"
          alt=""
          class="menu-image"
        />

        <span>Configurações</span>
      </button>

    </aside>

    <!-- Área onde as páginas serão carregadas -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
